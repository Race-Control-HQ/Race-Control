server {
  # Unprivileged nginx image runs as non-root and cannot bind ports <1024.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Clean URLs: /guide/models is served from guide/models.html, and a folder
  # such as /deploy/ from its index.html. Anything else is a real 404.
  error_page 404 /404.html;

  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "public, max-age=600";
  }

  location ~* \.(?:css|js|mjs|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|eot)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
