# XcodeGen spec — a fallback way to (re)generate RaceControl.xcodeproj.
# Only needed if the bundled .xcodeproj ever gets out of sync. Install with
# `brew install xcodegen`, then run `xcodegen generate` from this folder.
name: RaceControl
options:
  bundleIdPrefix: com.owlmedia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
targets:
  RaceControl:
    type: application
    platform: iOS
    sources:
      - path: RaceControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owlmedia.racecontrol
        INFOPLIST_FILE: RaceControl/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
  RaceControlTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RaceControlTests
    dependencies:
      - target: RaceControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owlmedia.racecontrol.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  RaceControl:
    build:
      targets:
        RaceControl: all
        RaceControlTests: [test]
    test:
      targets:
        - RaceControlTests
    run:
      config: Debug
