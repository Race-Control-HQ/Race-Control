version: 2
updates:
  # backend: Python (pip) dependencies. requirements.in sets floors/ceilings;
  # requirements.txt is the pip-compile lock actually installed. Dependabot
  # detects the pair and re-runs pip-compile itself, so each PR carries a
  # resolved lock. Grouped into one weekly PR to keep the noise down.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns: ["*"]

  # Web app and project site: npm. Minor and patch updates are grouped; majors
  # (Next.js, React, ESLint) arrive as individual PRs so they can be reviewed.
  - package-ecosystem: "npm"
    directory: "/RaceControlWeb"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/RaceControlSite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      site-minor-patch:
        update-types: ["minor", "patch"]

  # Android: Gradle plugins and libraries from gradle/libs.versions.toml.
  - package-ecosystem: "gradle"
    directory: "/RaceControlAndroid"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      android-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by the CI workflows themselves.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
