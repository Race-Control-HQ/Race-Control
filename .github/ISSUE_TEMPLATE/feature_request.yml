name: Feature request
description: Suggest an improvement or a new feature
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which piece of RaceControl would this change?
      multiple: true
      options:
        - iOS app
        - Android app
        - Web app
        - Backend API
        - Project site
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe what you are trying to do and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine it working? Sketches and examples from other apps are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
