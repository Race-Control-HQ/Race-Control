name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "RaceControlWeb/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "RaceControlWeb/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: RaceControlWeb

jobs:
  build:
    name: lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: RaceControlWeb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
