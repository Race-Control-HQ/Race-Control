name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "RaceControlApp/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "RaceControlApp/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: RaceControlApp

jobs:
  build:
    name: Build + unit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version in use
        run: xcodebuild -version

      - name: Build (unsigned, simulator destination)
        run: |
          xcodebuild build \
            -project RaceControl.xcodeproj \
            -scheme RaceControl \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      # Needs a concrete simulator rather than the "generic" destination above,
      # because the unit-test bundle is hosted by the app and has to actually run.
      - name: Unit tests
        run: |
          xcodebuild test \
            -project RaceControl.xcodeproj \
            -scheme RaceControl \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
