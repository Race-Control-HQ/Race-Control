name: Docs CI

on:
  push:
    branches: [main]
    paths:
      - "RaceControlDocs/**"
      - ".github/workflows/docs-ci.yml"
  pull_request:
    paths:
      - "RaceControlDocs/**"
      - ".github/workflows/docs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: RaceControlDocs

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: RaceControlDocs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run docs:build
